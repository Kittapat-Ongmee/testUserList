<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User List</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header class="mb-5">
      <div class="container mt-5">
        <div class="d-flex justify-content-end">
          <div class="btn-group">
            <button class="btn btn-secondary" data-bs-theme-value="dark">
              Dark
            </button>
            <button class="btn btn-light" data-bs-theme-value="light">
              Light
            </button>
          </div>
        </div>
      </div>
      <h1 class="mb-4">Users</h1>
      <!-- Search box -->
      <div class="row">
        <div class="col-md-4">
          <input
            type="text"
            class="form-control form-control-lg"
            placeholder="Search Users"
          />
        </div>

        <div class="col-md-8">
          <div
            class="col-md-8 user-menu d-flex justify-content-end align-items-center"
          >
            <ul class="nav">
              <li class="nav-item">
                <a class="nav-link" href="#">Reputation</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-bg-primary rounded-3" href="#"
                  >New Users</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Editors</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Moderators</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/darkmodetoggle.js"></script>
  </body>
</html>
